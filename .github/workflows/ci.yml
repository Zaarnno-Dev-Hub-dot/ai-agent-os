name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (shared, adapters, gateway, UI)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Type-check every workspace
        run: npm run verify
      - name: Tests
        run: npm test